# nginx.conf — reverse proxy cho simple-next trên VPS.
#
# Cài:  sudo install -m 644 /opt/simple-next-prod/deploy/vps/nginx.conf \
#         /etc/nginx/sites-available/simple-next \
#       sudo ln -sfn /etc/nginx/sites-available/simple-next /etc/nginx/sites-enabled/simple-next \
#       sudo rm -f /etc/nginx/sites-enabled/default \
#       sudo nginx -t && sudo systemctl reload nginx
#
# `rm sites-enabled/default` KHÔNG phải vì simple-next: file default của Ubuntu khai
# `listen 80 default_server`, trùng với block :80 của mom-baby-app ⇒ `duplicate
# default server for 0.0.0.0:80`. mom-baby đã gỡ từ setup của nó; dòng này giữ cho
# VPS không bị sót lại file default. simple-next dùng cổng riêng (8019/8018).
# Xem docs §2.5b về việc nhiều project trên cùng VPS.
#
# Sơ đồ (app KHÔNG tự lộ ra internet — chỉ 127.0.0.1):
#   :8019 → 127.0.0.1:3119   (prod,    nhánh main,  /opt/simple-next-prod)
#   :8018 → 127.0.0.1:3118   (staging, nhánh dev,   /opt/simple-next-staging)
#
# Cổng khác mom-baby (đang dùng :80 → 3000 và :8001 → 3002) để hai app chạy song
# song trên cùng một VPS.
#
# ⚠️ Còn CHƯA có TLS. Khi đã có domain, thêm `server_name` + `listen 443 ssl` và đổi
# `listen 80` thành trả redirect — xem khối "KHI ĐÃ CÓ DOMAIN" ở cuối file.

# ⚠️ KHÔNG đặt `proxy_*` ở TOP LEVEL của file này. File được include vào trong
# `http{}`, nên top level = context `http{}` — dùng chung với mọi project khác trên
# VPS. Mỗi directive giá trị đơn (`proxy_http_version`, `proxy_buffering`,
# `proxy_buffers`, `proxy_connect_timeout`, ...) chỉ nhận MỘT lần cho mỗi block,
# nên khi mom-baby-app khai cùng những directive đó ở top level file của nó thì:
#
#   "proxy_http_version" directive is duplicate in
#   /etc/nginx/sites-enabled/simple-next:30
#
# (`proxy_set_header` thoát nạn vì là directive kiểu block nên nginx cho gộp, nhưng
# để nó ở `http{}` cũng làm header của project này áp lên project khác — không nên.)
# Vì vậy mọi thứ dưới đây nằm TRONG từng `server {}` để mỗi project tự chứa.
#
# `upstream` thì ngược lại: nó là namespace TOÀN CỤC của nginx, đặt trong `server`
# cũng không cô lập được. Phải đặt ở top level và đặt tên KHÔNG TRÙNG với project
# khác — 2 project cùng tặng `upstream prod` thì `nginx -t` báo `duplicate upstream`.

# Upstream của riêng simple-next (mom-baby dùng mom_baby_prod / mom_baby_staging).
upstream simple_next_prod {
    server 127.0.0.1:3119;
    keepalive 32;
}

upstream simple_next_staging {
    server 127.0.0.1:3118;
    keepalive 32;
}

# ── Prod: http://IP-VPS:8019 ──────────────────────────────────────────────────
server {
    listen 8019;
    listen [::]:8019;
    server_name _;

    # Next.js tự tính kích thước file nén; nginx chỉ gửi header, không tự nén lại
    # (nén hai lần tốn CPU mà không thêm gì).
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Trang `/` hiện header này để kiểm tra chuỗi proxy có đúng không.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_buffering on;
    proxy_buffers 16 16k;
    proxy_busy_buffers_size 32k;

    location / {
        proxy_pass http://simple_next_prod;
    }
}

# ── Staging: http://IP-VPS:8018 ───────────────────────────────────────────────
# ⚠️ Staging đang MỞ RA INTERNET. Chỉ nên dùng để test nội bộ; khi có domain thì
# chuyển sang subdomain + IP allowlist.
server {
    listen 8018;
    listen [::]:8018;
    server_name _;

    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_buffering on;
    proxy_buffers 16 16k;
    proxy_busy_buffers_size 32k;

    location / {
        proxy_pass http://simple_next_staging;
    }
}

# ── KHI ĐÃ CÓ DOMAIN, LÊN HTTPS ──────────────────────────────────────────────
# ⚠️ Block `listen 443` MỚI phải copy lại nguyên khối `proxy_*` (http_version,
# set_header, timeout, buffering, buffers) — chúng đang nằm trong `server`, không
# kế thừa từ block `listen 8019`. Thiếu là `X-Forwarded-Proto` không được set ⇒
# trang `/` hiện `(missing)` dù vẫn truy cập được.
#
#   server {
#       listen 8019;
#       listen [::]:8019;
#       server_name simple.example.com;
#       return 301 https://$host$request_uri;
#   }
#   server {
#       listen 443 ssl;
#       listen [::]:443 ssl;
#       http2 on;
#       server_name simple.example.com;
#       ssl_certificate     /etc/letsencrypt/live/simple.example.com/fullchain.pem;
#       ssl_certificate_key /etc/letsencrypt/live/simple.example.com/privkey.pem;
#       ... copy nguyên khối proxy_* như block 8019 ở trên ...
#       location / {
#           proxy_pass http://simple_next_prod;
#       }
#   }
